name: devops-fase2

x-logging: &bounded-logs
  driver: json-file
  options:
    max-size: "5m"
    max-file: "2"

services:
  api:
    image: ${APP_IMAGE:?Defina APP_IMAGE ou use scripts/deploy.sh}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    memswap_limit: 256m
    cpus: 0.5
    tmpfs: [/tmp:rw,noexec,nosuid,size=16m]
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    volumes: [tasks:/data]
    networks: [app]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging: *bounded-logs

  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=1d
      - --storage.tsdb.retention.size=128MB
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - metrics:/prometheus
    networks: [app]
    logging: *bounded-logs

  grafana:
    image: grafana/grafana:13.3.1
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    tmpfs: [/tmp:rw,noexec,nosuid,size=32m]
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    secrets: [grafana_admin_password]
    ports: ["127.0.0.1:${GRAFANA_PORT:-3000}:3000"]
    volumes:
      - dashboards:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    networks: [app]
    logging: *bounded-logs

networks:
  app:
    driver: bridge

volumes:
  tasks:
  metrics:
  dashboards:

secrets:
  grafana_admin_password:
    file: ./.secrets/grafana_admin_password
