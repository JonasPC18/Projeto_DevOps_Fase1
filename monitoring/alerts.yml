groups:
  - name: tarefas
    rules:
      - alert: ApiIndisponivel
        expr: up{job="tarefas"} == 0
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: A API de tarefas esta indisponivel
          description: Conferir os logs do servico api e a ultima entrega.
      - alert: ErrosElevados
        expr: sum(rate(devops_http_requests_total{status=~"5.."}[2m])) / clamp_min(sum(rate(devops_http_requests_total[2m])), 0.001) > 0.05
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Mais de 5 por cento das requisicoes retornam erro de servidor
